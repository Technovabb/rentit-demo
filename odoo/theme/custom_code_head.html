<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
/* Rent It.BB demo theme by Tech Nova, in Rent It's brand: Cobalt on white, Montserrat Bold and Medium (the Allura script is kept for artwork only). Calm and elegant. */
:root{--ri-brand:#044CAB;--ri-brand-ink:#033B86;--ri-brand-2:#2050BB;--ri-polo:#8AACD7;--ri-brand-50:#EDF2FA;--ri-brand-100:#C9D8EE;--ri-ink:#272646;--ri-ink-2:#4A4966;--ri-muted:#6B6A80;--ri-line:#E4E7EE;--ri-line-2:#EEF0F5;--ri-bg:#FFFFFF;--ri-soft:#FFFFFF;--ri-star:#D9A21B;--ri-wa:#1FAE53;--ri-r:12px;--ri-shadow:0 1px 2px rgba(39,38,70,.05),0 8px 24px rgba(39,38,70,.07);--ri-ui:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#wrapwrap{overflow-x:clip}
body,#wrapwrap{font-family:var(--ri-ui);color:var(--ri-ink);background:var(--ri-bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6,.h1,.h2,.h3,.h4,.h5,.h6,.display-1,.display-2,.display-3,.display-4{font-family:var(--ri-ui);color:var(--ri-ink);letter-spacing:-.01em}
h1,.h1,h2,.h2{font-weight:700;line-height:1.15}
h3,h4,h5,h6,.h3,.h4,.h5,.h6{font-weight:600}
a{color:var(--ri-brand)} a:hover{color:var(--ri-brand-ink)}
#wrapwrap :focus-visible:not([contenteditable]){outline:3px solid var(--ri-brand-2)!important;outline-offset:2px}
#wrapwrap .ri-hero :focus-visible,#wrapwrap .ri-banner :focus-visible,#wrapwrap .ri-cta :focus-visible,footer#bottom :focus-visible{outline-color:var(--ri-brand-100)!important}
.text-primary{color:var(--ri-brand)!important}.bg-primary{background-color:var(--ri-brand)!important}

/* buttons: scoped to the page and its dialogs so Odoo editor controls keep their own look */
#wrapwrap .btn,.modal-content .btn{--btn-border-radius:999px;font-weight:600;letter-spacing:.01em}
.btn-primary,.btn-primary:focus,.o_wsale_product_btn .btn-primary,#add_to_cart,button[name="add_to_cart"],.a-submit.btn-primary{background:var(--ri-brand)!important;border-color:var(--ri-brand)!important;color:#fff!important}
.btn-primary:hover,.btn-primary:active,#add_to_cart:hover,button[name="add_to_cart"]:hover{background:var(--ri-brand-ink)!important;border-color:var(--ri-brand-ink)!important;color:#fff!important}
.btn-secondary,.btn-outline-primary{border-color:var(--ri-brand)!important;color:var(--ri-brand)!important;background:#fff!important}
.btn-secondary:hover,.btn-outline-primary:hover{background:var(--ri-brand-50)!important}
.ri-banner .btn-light,.ri-hero .btn-light,.ri-cta .btn-light{background:#fff;border-color:#fff;color:var(--ri-ink)!important}
.ri-banner .btn-light:hover,.ri-hero .btn-light:hover,.ri-cta .btn-light:hover{background:var(--ri-brand-50);border-color:var(--ri-brand-50)}
.ri-banner .btn-outline-light,.ri-hero .btn-outline-light,.ri-cta .btn-outline-light{color:#fff!important;border-color:rgba(255,255,255,.7)!important;background:transparent}
.ri-banner .btn-outline-light:hover,.ri-hero .btn-outline-light:hover,.ri-cta .btn-outline-light:hover{background:rgba(255,255,255,.12)!important}

/* header */
header#top{background:#fff;border-bottom:1px solid var(--ri-line)}
header#top .navbar{background:#fff!important;box-shadow:none!important}
header#top .nav-link{color:var(--ri-ink)!important;font-weight:500;font-size:.92rem;border-radius:8px;padding-left:.8rem!important;padding-right:.8rem!important}
header#top .nav-link:hover{color:var(--ri-brand)!important}
header#top .nav-link.active{color:var(--ri-brand)!important;font-weight:600}
#wrapwrap header#top .nav-item>.nav-link>*{color:inherit!important}
header#top .navbar-brand img,header#top .o_header_logo img{height:30px!important;max-height:30px!important;width:auto}
@media (max-width:991.98px){header#top .navbar-brand img,header#top .o_header_logo img{height:24px!important;max-height:24px!important}}
header#top .my_cart_quantity,header#top .o_wsale_my_cart .badge{background:var(--ri-brand)!important;color:#fff!important}
header#top .o_header_text_element,header#top a[href^="tel:"],header#top .o_nav-link_secondary,header#top .btn_cta{display:none!important}
/* Sign in: a quiet secondary link, so the page leads with building a quote */
header#top a.o_nav_link_btn{background:transparent!important;border:1px solid var(--ri-line)!important;color:var(--ri-ink-2)!important;border-radius:999px!important;font-weight:500;font-size:.86rem;padding:.3rem .9rem!important}
header#top a.o_nav_link_btn:hover{border-color:var(--ri-brand-100)!important;color:var(--ri-brand)!important;background:transparent!important}
/* the cart is the client's quote */
header#top .o_wsale_my_cart>a{display:inline-flex!important;align-items:center;gap:.35rem;width:auto!important;border-radius:999px!important;padding:.3rem .75rem!important;border:1px solid var(--ri-brand-100)!important;color:var(--ri-brand)!important}
header#top .o_wsale_my_cart>a:hover{background:var(--ri-brand-50)!important}
header#top .o_wsale_my_cart .ri-quote-lbl{font-weight:600;font-size:.86rem;line-height:1}
header#top .o_searchbar_form .form-control,header#top .o_searchbar_form input{border-radius:10px}
.offcanvas .nav-link{color:var(--ri-ink)!important;font-weight:600}

/* Shop dropdown: every category, three columns on desktop. It opens on hover after a short pause (see footer code). */
header#top .dropdown-menu{border:1px solid var(--ri-line);border-radius:12px;box-shadow:0 18px 40px rgba(39,38,70,.12);padding:.5rem}
header#top .dropdown-item{border-radius:8px;font-size:.9rem;color:var(--ri-ink);padding:.45rem .8rem}
header#top .dropdown-item:hover,header#top .dropdown-item:focus{background:var(--ri-brand-50);color:var(--ri-brand)}
@media (min-width:992px){
 header#top .navbar-nav .ri-shop-dd>.dropdown-menu{display:grid!important;grid-template-columns:repeat(3,minmax(178px,1fr));grid-template-rows:repeat(8,auto);grid-auto-flow:column;gap:2px 6px;padding:14px;margin-top:4px!important;top:100%;left:0;visibility:hidden;opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s;pointer-events:none}
 header#top .navbar-nav .ri-shop-dd.ri-open>.dropdown-menu,header#top .navbar-nav .ri-shop-dd:focus-within>.dropdown-menu{visibility:visible;opacity:1;transform:none;transition-delay:0s;pointer-events:auto}
 header#top .navbar-nav .ri-shop-dd>.dropdown-menu>li:first-child .dropdown-item{font-weight:600;color:var(--ri-brand)}
}

/* shop + product page (Odoo eCommerce) */
#products_grid h1,.o_wsale_products_main_row h1{font-weight:700}
.oe_product .oe_product_cart,.o_wsale_product_grid_wrapper .oe_product_cart,.o_wsale_products_grid_table_wrapper .oe_product_cart{background:#fff;border:1px solid var(--ri-line)!important;border-radius:var(--ri-r)!important;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.oe_product .oe_product_cart:hover{box-shadow:var(--ri-shadow);border-color:var(--ri-brand-100)!important}
.oe_product .oe_product_image{background:#fff}
.oe_product .oe_product_image img{object-fit:contain!important}
.o_wsale_product_information{padding:.75rem .9rem .9rem!important}
.o_wsale_products_item_title a,.o_wsale_product_information h6 a{color:var(--ri-ink)!important;font-weight:600;font-size:.9rem;line-height:1.35}
.product_price,.product_price .oe_price,.oe_price,.oe_currency_value{color:var(--ri-brand)!important;font-weight:700}
.product_price .h6,.product_price span.h6{color:var(--ri-muted)!important;font-weight:500;font-size:.85rem}
/* prices are per day, before VAT, as on rentit.bb */
.oe_product .product_price:after,#product_details .product_price:after{content:'+ 17.5% VAT';display:block;color:var(--ri-muted);font-weight:500;font-size:.74rem;letter-spacing:.01em;margin-top:.1rem}
#product_details .product_price:after{font-size:.85rem}
/* Listings show the price without "/ Day" (rentals can run longer); the product page keeps it as a small label */
.oe_product .product_price .h6{display:none!important}
.o_wsale_product_btn,.o_wsale_product_btn .btn,.oe_product .o_wsale_product_btn{opacity:1!important;visibility:visible!important;transform:none!important}
.o_wsale_product_btn .btn{min-height:40px;min-width:40px}
.o_ribbon,.o_wsale_ribbon{border-radius:8px!important;font-weight:600}
.o_wsale_products_main_row .products_categories .nav-link.active,.o_categories_collapse_title.active{color:var(--ri-brand)!important}
.o_wsale_filmstrip_wrapper .nav-link,.o_wsale_filmstip_wrapper .nav-link,.o_wsale_filmstrip .nav-link{border-radius:999px!important;border:1px solid var(--ri-line)!important;color:var(--ri-ink)!important;background:#fff!important;font-weight:500;font-size:.86rem}
.o_wsale_filmstrip_wrapper .nav-link.active,.o_wsale_filmstip_wrapper .nav-link.active,.o_wsale_filmstrip .nav-link.active,.o_wsale_filmstrip .active>.nav-link{background:var(--ri-brand)!important;border-color:var(--ri-brand)!important;color:#fff!important}
#product_details h1{font-size:clamp(1.6rem,3.4vw,2.2rem)}
#product_details .product_price .oe_price,#product_details .oe_price{font-size:1.6rem}
#add_to_cart_wrap,#add_to_cart,button[name="add_to_cart"]{visibility:visible!important;opacity:1!important}
.o_website_sale_rental input,.o_website_sale_daterange_picker input{border-radius:10px}
/* Checkout address: no VAT number box; the VAT field stays on the customer in the back end */
.o_website_sale_address #div_vat{display:none!important}
.ri-pfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:1.2rem 0 .4rem;padding:0;list-style:none}
.ri-pfacts li{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:.75rem;border:1px solid var(--ri-line);border-radius:10px;background:#fff;font-size:.8rem;line-height:1.35;color:var(--ri-ink-2)}
.ri-pfacts svg{width:22px;height:22px;stroke:var(--ri-brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ri-pfacts b{display:block;color:var(--ri-ink);font-size:.84rem}

/* footer */
footer#bottom,footer#bottom .o_footer,footer#bottom .o_footer_copyright{background:var(--ri-brand)!important;color:#E3ECF8!important}
footer#bottom .o_footer_copyright{border-top:1px solid rgba(255,255,255,.18)}
footer#bottom .o_footer_copyright,footer#bottom .o_footer_copyright span,footer#bottom .o_footer_copyright p{color:#E3ECF8!important}
footer#bottom a{color:#FFFFFF!important;text-decoration:none}
footer#bottom a:hover{color:#fff!important;text-decoration:underline}
footer#bottom h1,footer#bottom h2,footer#bottom h3,footer#bottom h4,footer#bottom h5,footer#bottom h6{color:#fff!important}
.ri-footer h6{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:.9rem}
.ri-footer ul{list-style:none;padding:0;margin:0}
.ri-footer li{padding:.18rem 0}
.ri-footer .ri-flogo{max-width:190px;height:auto;margin-bottom:1rem}
.ri-footer p{color:#E3ECF8}
.ri-footer .ri-small{font-size:.78rem;color:#C9D8EE}
.ri-social{display:flex;gap:10px;margin-top:.9rem}
.ri-social a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.55);transition:background .2s,border-color .2s}
.ri-social a:hover{background:#fff;border-color:#fff;text-decoration:none!important}
.ri-social svg{width:18px;height:18px;fill:#fff;transition:fill .2s}
.ri-social a:hover svg{fill:var(--ri-brand)}

/* shared section pieces */
.ri-section{padding-top:clamp(44px,6vw,80px)!important;padding-bottom:clamp(44px,6vw,80px)!important}
.ri-section.ri-tight{padding-top:clamp(36px,5vw,64px)!important;padding-bottom:clamp(36px,5vw,64px)!important}
.ri-section.pt0{padding-top:0!important}
.ri-bg-white{background:#fff}
.ri-bg-soft,.ri-bg-sand{background:#fff;border-top:1px solid var(--ri-line-2);border-bottom:1px solid var(--ri-line-2)}
.ri-eyebrow{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ri-brand);margin-bottom:.6rem}
.ri-accent{display:block;font-family:var(--ri-ui);font-weight:500;font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.3;color:var(--ri-brand);margin:0 0 .55rem;letter-spacing:.01em}
.ri-accent-sm{font-size:.95rem;margin-bottom:.25rem}
.ri-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.6rem 1.5rem;margin-bottom:1.5rem}
.ri-head h2{margin:0;font-size:clamp(1.4rem,2.6vw,1.9rem)}
.ri-head p{margin:0;color:var(--ri-muted);max-width:40rem}
.ri-head-center{justify-content:center;text-align:center}
.ri-center{display:flex;justify-content:center;margin-top:clamp(24px,3vw,36px)}
.ri-link{font-weight:600;white-space:nowrap;text-decoration:none}
.ri-link:after{content:' \2192'}
.ri-muted{color:var(--ri-muted)}
.ri-stars{color:var(--ri-star);letter-spacing:1px}
.ri-rating{font-weight:600;font-size:.9rem;color:var(--ri-ink-2)}
.ri-fine{margin:1rem 0 0;font-size:.8rem;color:var(--ri-muted)}
.ri-list{padding-left:1.2rem;margin:0 0 1.2rem}
.ri-list li{padding:.3rem 0}

/* home hero: light photo hero with search */
/* the tiles overlap the hero's foot; while the search is in use its suggestions sit above them */
.ri-home-hero:focus-within{z-index:4}
.ri-home-hero{position:relative;z-index:1;background-color:#fff;padding:clamp(52px,7vw,104px) 0 clamp(92px,10vw,132px)!important;overflow:visible}
/* Rent It's hero photo is only 836px wide, so it fills the right side (at most 1100px) instead of the full width, and its left edge fades into the white */
.ri-home-hero>.ri-hero-img{position:absolute;top:0;right:0;width:min(55%,1100px);height:100%!important;max-width:none;object-fit:cover;object-position:55% 45%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.ri-home-hero>.o_we_bg_filter{position:absolute;top:0;right:0;bottom:0;left:0;background-image:linear-gradient(90deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.85) 42%,rgba(255,255,255,0) 62%)}
.ri-home-hero>.container{position:relative;z-index:1}
.ri-home-hero h1{font-size:clamp(2.2rem,5vw,3.7rem);font-weight:700;max-width:16ch;margin:0 0 1rem;line-height:1.08}
.ri-home-hero .ri-lead{font-size:clamp(1rem,1.5vw,1.1rem);color:var(--ri-ink-2);max-width:34rem;margin-bottom:1.7rem;line-height:1.6}
.ri-search{position:relative;max-width:620px}
.ri-search .input-group{display:flex;flex-wrap:nowrap;align-items:stretch;gap:8px;background:#fff;border:1px solid var(--ri-line);border-radius:999px;padding:6px;box-shadow:0 12px 32px rgba(39,38,70,.1)}
.ri-search label.ri-search-q{display:flex;align-items:center;gap:10px;flex:1 1 auto;margin:0;min-width:0;border-radius:999px;background:#fff;padding:0 6px 0 16px;cursor:text}
.ri-search-q svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:var(--ri-muted);stroke-width:2;stroke-linecap:round}
.ri-search .search-query{border:0!important;outline:0;box-shadow:none!important;background:transparent!important;width:100%;min-width:0;height:48px;padding:0!important;font:500 .95rem var(--ri-ui);color:var(--ri-ink)}
.ri-search .search-query::placeholder{color:var(--ri-muted)}
.ri-search label.ri-search-q:focus-within{box-shadow:inset 0 0 0 2px var(--ri-brand-100)}
.ri-search .ri-search-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4rem;padding:0 1.7rem!important;font-size:.98rem!important;border-radius:999px!important;text-decoration:none!important}
.ri-search .o_search_found_results{display:none!important}
.ri-search .o_dropdown_menu,.ri-search .dropdown-menu{border:1px solid var(--ri-line);border-radius:14px;box-shadow:0 18px 40px rgba(39,38,70,.14);margin-top:6px;z-index:1050}

/* quick category tiles + info strip */
.ri-quick{position:relative;z-index:2;background:transparent;padding:0 0 clamp(28px,4vw,44px)}
.ri-quick-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;max-width:860px;margin-top:-56px}
a.ri-qtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;min-height:106px;padding:14px 8px;background:#fff;border:1px solid var(--ri-line);border-radius:14px;box-shadow:var(--ri-shadow);color:var(--ri-ink);text-decoration:none;text-align:center;font-weight:600;font-size:.82rem;line-height:1.25;transition:border-color .2s,color .2s,box-shadow .2s}
a.ri-qtile:hover{border-color:var(--ri-brand-100);color:var(--ri-brand);box-shadow:0 12px 28px rgba(39,38,70,.1)}
a.ri-qtile svg{width:30px;height:30px;fill:none;stroke:var(--ri-brand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a.ri-qtile svg circle{fill:var(--ri-brand)}
.ri-assure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem 2.4rem;margin-top:clamp(32px,4.5vw,52px)}
.ri-assure-i{display:flex;align-items:flex-start;gap:.9rem}
.ri-assure-i svg{flex-shrink:0;width:40px;height:40px;padding:8px;border-radius:50%;background:var(--ri-brand-50);fill:none;stroke:var(--ri-brand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ri-assure-i b{display:block;font-size:.98rem;font-weight:600;color:var(--ri-ink);margin-bottom:.2rem}
.ri-assure-i span{display:block;font-size:.86rem;color:var(--ri-muted);line-height:1.55}

/* new arrivals (product cards) */
.ri-feat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
a.ri-fcard{display:flex;flex-direction:column;height:100%;background:#fff;border:1px solid var(--ri-line);border-radius:12px;overflow:hidden;color:var(--ri-ink);text-decoration:none;transition:box-shadow .2s,border-color .2s}
a.ri-fcard:hover{box-shadow:var(--ri-shadow);border-color:var(--ri-brand-100);color:var(--ri-ink)}
.ri-fcard .ri-ph{display:block;position:relative;overflow:hidden;aspect-ratio:1;background:#fff;border-bottom:1px solid var(--ri-line-2)}
.ri-fcard .ri-ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;padding:10px}
.ri-fcard .ri-body{display:flex;flex-direction:column;gap:.3rem;padding:.85rem .95rem .95rem;flex:1}
.ri-fcard b{font-size:.88rem;font-weight:600;line-height:1.35}
.ri-fcard .ri-price{color:var(--ri-brand);font-weight:700;font-size:1rem;margin-top:auto}
.ri-fcard .ri-price small{color:var(--ri-muted);font-weight:500;font-size:.76rem}

/* banner */
.ri-banner{position:relative;border-radius:16px;overflow:hidden;background-color:var(--ri-ink);background-size:cover;background-position:center 60%}
.ri-banner:before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(39,38,70,.95) 0%,rgba(4,76,171,.86) 55%,rgba(4,76,171,.72) 100%)}
.ri-banner-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem 2rem;padding:clamp(28px,4.5vw,48px) clamp(22px,4.5vw,52px);color:#fff}
.ri-banner h2{color:#fff;font-size:clamp(1.35rem,2.8vw,1.9rem);margin:0 0 .4rem}
.ri-banner p{color:#E3E9F5;margin:0;max-width:36rem}
.ri-btns{display:flex;flex-wrap:wrap;gap:.6rem}

/* quote steps: three numbered columns */
.ri-qsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);list-style:none;margin:0 auto;padding:0;max-width:1000px;counter-reset:none}
.ri-qsteps li{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 .5rem}
.ri-qsteps .ri-num{width:56px;height:56px;font-size:1.3rem;margin-bottom:1rem;background:#fff;color:var(--ri-brand);border:1.5px solid var(--ri-brand)}
.ri-qsteps h3{font-size:1.08rem;margin:0 0 .45rem}
.ri-qsteps p{color:var(--ri-muted);font-size:.92rem;line-height:1.6;margin:0;max-width:22rem}

/* home page video, under the quote steps */
.ri-video{max-width:860px;margin:clamp(28px,4vw,44px) auto 0;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--ri-shadow)}
.ri-video video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}

/* page head (about): photo with brand filter */
.ri-hero{position:relative;background-color:var(--ri-ink);background-size:cover;background-position:center 40%;color:#fff;overflow:hidden}
.ri-hero>.o_we_bg_filter{position:absolute;top:0;right:0;bottom:0;left:0}
.ri-hero>.container{position:relative;z-index:1}
.ri-hero h1{color:#fff;font-size:clamp(2rem,4.6vw,3.2rem);max-width:16ch;margin-bottom:.5rem}
.ri-hero h1 em{font-style:normal;color:var(--ri-polo)}
.ri-hero .ri-eyebrow{color:var(--ri-brand-100)}
.ri-hero .ri-lead{font-size:clamp(1rem,1.6vw,1.12rem);max-width:34rem;color:#E3E9F5;margin-bottom:1.4rem}
.ri-hero .ri-btns{display:flex;flex-wrap:wrap;gap:.6rem}
.ri-page-head h1{font-size:clamp(1.9rem,4.2vw,2.8rem);max-width:20ch}

/* category tiles (other pages) */
