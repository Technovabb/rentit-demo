<style>
#ri-demo-bar{background:#272646;color:#CFCEE0;font:500 .76rem/1.4 'Montserrat',system-ui,sans-serif;padding:7px 16px;text-align:center}
#ri-demo-bar b{color:#fff;font-weight:600}
#ri-wa-fab{position:fixed;right:16px;bottom:16px;z-index:1040;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#1FAE53;border:1px solid #E6E4D6;box-shadow:0 4px 14px rgba(39,38,70,.14);transition:background .2s,color .2s,opacity .2s,visibility .2s}
#ri-wa-fab:hover{background:#1FAE53;color:#fff;border-color:#1FAE53}
#ri-wa-fab:focus-visible{outline:3px solid #2050BB;outline-offset:3px}
#ri-wa-fab svg{width:22px;height:22px}
#ri-wa-fab.ri-away{opacity:0;visibility:hidden;pointer-events:none}
body:has(.offcanvas.show) #ri-wa-fab,body:has(.modal.show) #ri-wa-fab{display:none}
</style>
<script>
(function () {
  'use strict';
  var WA_URL = 'https://wa.me/12462348230';
  // Tracking IDs from Rent It go here. Until they are filled in nothing is loaded or sent;
  // events still go to window.dataLayer so they can be checked in the browser.
  var TRACK = { ga4: '', adsSendTo: '', pixel: '' };

  function editing() {
    var b = document.body;
    return !b || b.classList.contains('editor_enable') || b.classList.contains('o_edit_mode');
  }
  function onCheckout() {
    var p = location.pathname;
    return ['cart', 'checkout', 'address', 'payment', 'confirmation', 'confirm_order', 'extra_info'].some(function (s) {
      return p.indexOf('/shop/' + s) === 0;
    });
  }
  var desktop = window.matchMedia ? window.matchMedia('(min-width: 992px)') : { matches: true };

  // ---------------------------------------------------------------- tracking
  function consented() {
    var m = document.cookie.match(/(?:^|;\s*)website_cookies_bar=([^;]+)/);
    if (!m) return false;
    try { return !!JSON.parse(decodeURIComponent(m[1])).optional; } catch (e) { return false; }
  }
  function loadTags() {
    if (!consented()) return;
    var gid = TRACK.ga4 || (TRACK.adsSendTo && TRACK.adsSendTo.split('/')[0]);
    if (gid && typeof window.gtag !== 'function') {
      var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gid);
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      if (TRACK.ga4) window.gtag('config', TRACK.ga4);
      if (TRACK.adsSendTo) window.gtag('config', TRACK.adsSendTo.split('/')[0]);
    }
    if (TRACK.pixel && typeof window.fbq !== 'function') {
      var f = window.fbq = function () { f.callMethod ? f.callMethod.apply(f, arguments) : f.queue.push(arguments); };
      if (!window._fbq) window._fbq = f;
      f.push = f; f.loaded = true; f.version = '2.0'; f.queue = [];
      var t = document.createElement('script'); t.async = true; t.src = 'https://connect.facebook.net/en_US/fbevents.js';
      document.head.appendChild(t);
      window.fbq('init', TRACK.pixel); window.fbq('track', 'PageView');
    }
  }
  var EVENTS = {
    add_to_quote: ['add_to_cart', 'AddToCart'],
    quote_request: ['generate_lead', 'Lead'],
    whatsapp_click: ['whatsapp_click', 'Contact'],
    site_search: ['search', 'Search'],
  };
  function track(name, params) {
    params = params || {};
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: 'ri_' + name }, params));
    var ev = EVENTS[name];
    if (typeof window.gtag === 'function') {
      window.gtag('event', ev[0], params);
      if (name === 'quote_request' && TRACK.adsSendTo) window.gtag('event', 'conversion', { send_to: TRACK.adsSendTo });
    }
    if (typeof window.fbq === 'function') window.fbq('track', ev[1], params.search_term ? { search_string: params.search_term } : {});
  }
  window.RI_TRACK = { ids: TRACK, track: track };

  function wireTracking() {
    document.addEventListener('click', function (e) {
      if (editing() || !e.target.closest) return;
      var add = e.target.closest('#add_to_cart, button[name="add_to_cart"], a[name="add_to_cart"], .o_wsale_product_btn_primary');
      if (add) {
        var card = add.closest('.oe_product, form');
        var title = (card && card.querySelector('.o_wsale_products_item_title, h1')) || document.querySelector('#product_details h1');
        track('add_to_quote', { item_name: title ? title.textContent.trim().replace(/\s+/g, ' ') : '' });
      }
      if (e.target.closest('a[href*="wa.me/"]')) track('whatsapp_click', { page: location.pathname });
      var hit = e.target.closest('.o_searchbar_form .dropdown-menu a, .o_searchbar_form .o_dropdown_menu a');
      if (hit) {
        var q = hit.closest('.o_searchbar_form').querySelector('input[name="search"]');
        if (q && q.value.trim()) track('site_search', { search_term: q.value.trim() });
      }
    }, true);
    document.addEventListener('submit', function (e) {
      var q = e.target && e.target.querySelector && e.target.querySelector('input[name="search"]');
      if (q && q.value.trim()) track('site_search', { search_term: q.value.trim() });
    }, true);
    // The quote request is the main conversion: the confirmation page after "Request Quote".
    if (location.pathname.indexOf('/shop/confirmation') === 0) {
      var ref = (document.querySelector('#wrap h1, #wrap h3, #wrap .h3') || {}).textContent || location.pathname;
      var key = 'ri_quote_tracked_' + ref.trim().slice(0, 60);
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (err) { /* private mode */ }
      track('quote_request', {});
    }
  }

  // ---------------------------------------------------------------- demo bar + WhatsApp
  function addBar() {
    if (document.getElementById('ri-demo-bar')) return;
    var bar = document.createElement('div');
    bar.id = 'ri-demo-bar';
    bar.setAttribute('role', 'note');
    bar.innerHTML = '<b>Tech Nova demo for Rent It.BB.</b> Real items and prices. Bookings and stock are samples.';
    var header = document.querySelector('header#top');
    var wrap = document.getElementById('wrapwrap');
    if (header && header.parentNode) header.parentNode.insertBefore(bar, header);
    else if (wrap) wrap.insertBefore(bar, wrap.firstChild);
  }
  function watchAddToCart(fab) {
    if (!('IntersectionObserver' in window) || !window.matchMedia) return;
    var btn = document.querySelector('#o_wsale_cta_wrapper, #add_to_cart, button[name="add_to_cart"]');
    if (!btn) return;
    var phone = window.matchMedia('(max-width: 767.98px)');
    var seen = false;
    var apply = function () { fab.classList.toggle('ri-away', phone.matches && seen); };
    new IntersectionObserver(function (es) { seen = es[0].isIntersecting; apply(); }).observe(btn);
    if (phone.addEventListener) phone.addEventListener('change', apply);
  }
  function addFab() {
    if (document.getElementById('ri-wa-fab') || onCheckout()) return;
    var a = document.createElement('a');
    a.id = 'ri-wa-fab';
    a.href = WA_URL;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = 'WhatsApp';
    a.setAttribute('aria-label', 'Chat with Rent It.BB on WhatsApp');
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M8.5 9.5c.4 2.3 2.7 4.6 5 5l1.2-1.2 2 .9c-.3 1.2-1.2 1.8-2.4 1.8-3.5 0-7.3-3.8-7.3-7.3 0-1.2.6-2.1 1.8-2.4l.9 2-1.2 1.2z"/></svg>';
    document.body.appendChild(a);
    watchAddToCart(a);
  }

  // ---------------------------------------------------------------- "Quote", not "cart"
  var WORDS = {
    'add to cart': 'Add to Quote', 'view cart': 'View quote', 'go to cart': 'View quote',
    'your cart is empty!': 'Your quote is empty.', 'your cart is empty': 'Your quote is empty.',
    'shopping cart': 'Your quote', 'order summary': 'Quote summary', 'order overview': 'Quote summary',
    'proceed to checkout': 'Continue', 'checkout': 'Continue', 'continue shopping': 'Continue browsing',
    'back to cart': 'Back to your quote', 'return to cart': 'Back to your quote',
    'item(s) added to your cart': 'Added to your quote', 'item added to your cart': 'Added to your quote',
    'added to your cart': 'Added to your quote', 'confirm order': 'Request Quote',
  };
  function swapText(root) {
    if (!root || editing()) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var n, todo = [];
    while ((n = walker.nextNode())) {
      var k = n.nodeValue.trim().toLowerCase();
      if (k && WORDS[k] && !(n.parentNode && n.parentNode.closest && n.parentNode.closest('script,style,textarea,[contenteditable]'))) todo.push(n);
    }
    todo.forEach(function (t) { t.nodeValue = t.nodeValue.replace(t.nodeValue.trim(), WORDS[t.nodeValue.trim().toLowerCase()]); });
    Array.prototype.forEach.call((root.querySelectorAll ? root : document).querySelectorAll('[title],[aria-label]'), function (el) {
      ['title', 'aria-label'].forEach(function (a) {
        var v = el.getAttribute(a); if (v && WORDS[v.trim().toLowerCase()]) el.setAttribute(a, WORDS[v.trim().toLowerCase()]);
      });
    });
    if (location.pathname.indexOf('/shop/payment') === 0) {
      Array.prototype.forEach.call(document.querySelectorAll('[name="o_payment_submit_button"]'), function (b) {
        if (!/request quote/i.test(b.textContent)) b.textContent = 'Request Quote';
      });
    }
  }
  function quoteHeader() {
    if (/^Shopping Cart/.test(document.title)) document.title = document.title.replace(/^Shopping Cart/, 'Your quote');
    Array.prototype.forEach.call(document.querySelectorAll('header .o_wsale_my_cart > a'), function (a) {
      if (a.querySelector('.ri-quote-lbl')) return;
      var s = document.createElement('span'); s.className = 'ri-quote-lbl'; s.textContent = 'Quote';
      a.appendChild(s);
      a.setAttribute('aria-label', 'Your quote'); a.title = 'Your quote';
    });
  }
  // The quote is requested, not paid for, at checkout: keep the demo card for deposits on sent quotes,
  // but only offer the quote request here.
  function quoteOnlyPayment() {
    if (location.pathname.indexOf('/shop/payment') !== 0) return;
    var radios = document.querySelectorAll('input[name="o_payment_radio"]');
    var keep = null;
    Array.prototype.forEach.call(radios, function (r) {
      var row = r.closest('li, .o_payment_option, .list-group-item');
      if (r.dataset.providerCode === 'demo') { if (row) row.style.display = 'none'; }
      else if (!keep) keep = r;
    });
    if (keep && !keep.checked) keep.click();
  }

  // ---------------------------------------------------------------- Shop menu: hover to open on desktop, click goes to the shop
  function wireShopMenu() {
    var toggles = document.querySelectorAll('header#top .navbar-nav .dropdown > .dropdown-toggle');
    Array.prototype.forEach.call(toggles, function (t) {
      if (t.textContent.trim().toLowerCase() !== 'shop') return;
      var li = t.parentNode, openT = null, closeT = null;
      li.classList.add('ri-shop-dd');
      li.addEventListener('mouseenter', function () {
        if (!desktop.matches) return;
        clearTimeout(closeT); openT = setTimeout(function () { li.classList.add('ri-open'); }, 140);
      });
      li.addEventListener('mouseleave', function () {
        if (!desktop.matches) return;
        clearTimeout(openT); closeT = setTimeout(function () { li.classList.remove('ri-open'); }, 180);
      });
      t.addEventListener('click', function (e) {
        if (!desktop.matches) return; // phones and tablets: the menu expands
        e.preventDefault(); e.stopPropagation();
        location.href = '/shop';
      }, true);
    });
  }

  // ---------------------------------------------------------------- recent events: tap to see the second photo
  function wireEvents() {
    document.addEventListener('click', function (e) {
      var f = e.target.closest && e.target.closest('.ri-ev');
      if (f && !editing()) f.classList.toggle('ri-flip');
    });
    document.addEventListener('keydown', function (e) {
      var f = e.target.closest && e.target.closest('.ri-ev');
      if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); f.classList.toggle('ri-flip'); }
    });
  }

  function init() {
    if (editing()) return;
    addBar();
    addFab();
    quoteHeader();
    swapText(document.getElementById('wrapwrap') || document.body);
    quoteOnlyPayment();
    wireShopMenu();
    wireEvents();
    wireTracking();
    loadTags();
    // Odoo adds notifications, cart pop-ups and payment options after load: reword those too.
    if ('MutationObserver' in window) {
      var pending = false;
      new MutationObserver(function () {
        if (pending) return; pending = true;
        setTimeout(function () { pending = false; quoteHeader(); swapText(document.body); quoteOnlyPayment(); }, 60);
      }).observe(document.body, { childList: true, subtree: true });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
